version: '3.8'

services:
  backend:
    build:
      context: .
      target: development
    ports:
      - "4000:4000"
    volumes:
      - ./src:/app/src
      - ./.env.development:/app/.env.development
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/realtime_notes?schema=public
      - NODE_ENV=development
    depends_on:
      - postgres
    command: npm run dev

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=realtime_notes
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
